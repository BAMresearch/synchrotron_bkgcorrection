[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "background-correction-studio"
version = "1.0.0.dev0"
description = "Responsive desktop background subtraction and spectral-series plotting"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.13,<2",
    "matplotlib>=3.9,<4",
    "PySide6>=6.7,<7",
]

[project.optional-dependencies]
build = ["pyinstaller>=6,<7", "Pillow>=10,<12"]

[project.gui-scripts]
background-correction-studio = "background_correction_studio:main"

[tool.setuptools]
packages = ["background_app"]
py-modules = ["background_correction_studio"]

[tool.setuptools.package-data]
background_app = ["assets/*.svg", "assets/*.png", "assets/*.ico"]
